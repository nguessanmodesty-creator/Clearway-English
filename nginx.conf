# AETERNA — development server for the static site.
# Mounted at /etc/nginx/nginx.conf. Workers run as root because the bind-mounted
# source directory in the sandbox is only readable by its owner.
worker_processes 1;
user root;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The sandbox preview serves the live source: never cache, so edits show on reload.
    add_header Cache-Control "no-store" always;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
