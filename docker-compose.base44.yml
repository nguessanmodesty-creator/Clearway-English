services:
  web:
    image: nginx:alpine
    labels:
      base44.project: "AETERNA"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/usr/share/nginx/html:ro"
      - "${BASE44_PROJECT_ROOT}/nginx.conf:/etc/nginx/nginx.conf:ro"
    environment:
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 5s
